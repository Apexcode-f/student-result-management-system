<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Student Result System</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #005fa3, #0078d7);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }

      .login-box {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        padding: 30px 24px;
        border-radius: 18px;
        width: 380px;
        color: white;
        text-align: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        animation: fadeInUp 0.8s ease;
      }

      .login-box h2 {
        margin-bottom: 25px;
        font-size: 26px;
        letter-spacing: 1px;
      }

      .input-group {
        position: relative;
        margin: 10px 0;
      }

      .input-group input {
        width: 100%;
        padding: 12px;
        background: transparent;
        border: none;
        border-bottom: 2px solid #d0d0d0;
        color: white;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
      }

      .input-group label {
        position: absolute;
        left: 0;
        top: 12px;
        color: #ccc;
        font-size: 15px;
        pointer-events: none;
        transition: 0.3s ease;
      }

      .input-group input:focus ~ label,
      .input-group input:valid ~ label {
        top: -10px;
        font-size: 13px;
        color: #fff;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #00aaff;
        color: white;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
      }

      button:hover {
        background: #008bd1;
        transform: scale(1.03);
      }

      .links {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
      }

      .links button {
        width: 48%;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      .links button:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="auth login">
    <div class="login-box">
      <h2>Login</h2>
      <form id="loginForm" action="/api/login" method="post" autocomplete="on">
        <div class="input-group">
          <input type="text" id="username" name="username" required />
          <label for="username">Username</label>
        </div>
        <div class="input-group">
          <input type="password" id="password" name="password" required />
          <label for="password">Password</label>
        </div>
        <button type="submit">Login</button>

        <div class="links">
          <button type="button" onclick="window.location.href='index.html'">
            Home
          </button>
          <button type="button" onclick="window.location.href='register.html'">
            Register
          </button>
        </div>
      </form>
      <p id="loginMessage" aria-live="polite"></p>
      <div class="insight">
        <strong>About the system:</strong>
        <p>
          Students can securely view their semester results, print transcripts,
          and track GPA over time. Teachers can publish results and admins
          manage users.
        </p>
      </div>
    </div>

    <script src="js/login.js" defer></script>
  </body>
</html>
