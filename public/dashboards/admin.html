<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- If you have an admin.js, keep this line. Otherwise, remove it. -->
    <script src="../js/admin.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Admin Dashboard</h1>
      <nav>
        <a href="../index.html">Home</a>
        <button id="logoutBtn">Logout</button>
      </nav>
    </header>

    <main class="dashboard">
      <section>
        <h2>Welcome, <span id="adminName"></span></h2>
      </section>

      <section>
        <h3>All Users</h3>
        <table id="usersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h3>All Results</h3>
        <table id="allResultsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Student</th>
              <th>Course</th>
              <th>Score</th>
              <th>Grade</th>
              <th>Teacher</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <section id="reportCardSection" class="report-section">
        <h2>Generate Digital Report Card</h2>
        <form id="reportForm">
          <label for="studentId">Enter Student ID:</label>
          <input type="text" id="studentId" name="studentId" placeholder="Student ID" required>
          <button type="submit">Generate Report Card</button>
        </form>
        <div id="reportMessage"></div>
      </section>

    </main>
  </body>
</html>
